[project]
name = "autolab"
version = "0.0.0"
description = "Autonomous research agent with verifiable chain-of-thought reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "AutoLab Team" }]

dependencies = [
  # LLM SDK — orchestrator + agents call Claude via native tool-use for structured outputs.
  "anthropic>=0.40",
  # Orchestration — LangGraph StateGraph, checkpointing, HITL interrupt() primitive.
  "langgraph>=0.2",
  # Validation — every LLM output passes through a Pydantic v2 model.
  "pydantic>=2.7",
  # Env/secrets loading — pydantic-settings reads .env without leaking creds into code.
  "pydantic-settings>=2.4",
  # Symbolic solver — Z3 entailment checks underpin the VeriCoT verifier.
  "z3-solver>=4.13",
  # ORM — SQLAlchemy 2.0 async ORM for execution traces & persistent memory.
  "sqlalchemy[asyncio]>=2.0",
  # Migrations — Alembic manages the Postgres schema.
  "alembic>=1.13",
  # SQLite async driver — used in tests; Postgres adapter added once available in CI.
  "aiosqlite>=0.20",
  # Redis client — async checkpointer + agent comms.
  "redis>=5.0",
  # API gateway — FastAPI fronts tool endpoints + hardware mocks.
  "fastapi>=0.115",
  # ASGI server.
  "uvicorn>=0.30",
  # HTTP client used by literature tools.
  "httpx>=0.27",
  # Structured logging — never print().
  "structlog>=24.1",
  # YAML — golden traces for the verifier are authored in YAML for readability.
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Dashboard stack — heavy; opt-in to keep core CI fast (see ADR-0002).
dashboard = ["streamlit>=1.36"]
# Multimodal RAG — chromadb pulls onnxruntime; opt-in for Phase 5+.
rag = ["chromadb>=0.5"]

[project.scripts]
autolab = "autolab.cli:main"

[dependency-groups]
dev = [
  # Test runner + async support + property-based tests.
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  # Lint + format.
  "ruff>=0.6",
  # Strict static typing.
  "mypy>=1.11",
  # Stubs for typed third-party packages.
  "types-redis",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autolab"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
  "live: hits real external services; gated on RUN_LIVE_TESTS=1",
]

[tool.coverage.run]
source = ["src/autolab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["z3.*", "chromadb.*", "streamlit.*"]
ignore_missing_imports = true
